[build-system]
requires = ["setuptools>=77", "wheel", "filelock>=3.16,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "pclass-dark"
version = "0.0.1"
description = "Protein function classification using cluster-conserved PLM signatures"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Junjun Mao" }]
keywords = ["bioinformatics", "protein-function", "protein-language-models"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "profunc>=0.1.0,<0.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "typer>=0.16",
    "rich>=13.8.0",
    "filelock>=3.16,<4",
    "threadpoolctl>=3.2,<4",
]

[project.optional-dependencies]
# Optional for setup-data inference; completed artifacts need no PLM stack.
embeddings = [
    "torch>=2.6,<3",
    "transformers>=4.40,<6",
    "huggingface-hub>=0.26,<2",
    "safetensors>=0.4,<1",
]
dev = ["build>=1", "pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/newbooks/PClass-Dark"
Repository = "https://github.com/newbooks/PClass-Dark"
Issues = "https://github.com/newbooks/PClass-Dark/issues"

[project.scripts]
pclass-dark = "pclass_dark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pclass_dark = [
    "resources/prepared/*/*.tsv",
    "resources/prepared/*/*.fasta",
    "resources/prepared/*/*.json",
    "resources/embeddings/*/*.npy",
    "resources/embeddings/*/*.tsv",
    "resources/embeddings/*/*.json",
    "resources/selection.json",
    "resources/library/selection.json",
    "resources/library/*/*.json",
    "resources/library/*/*.tsv",
    "resources/library/*/*.gz",
    "resources/library/*/clusters/*/*.json",
    "resources/library/*/clusters/*/*.gz",
    "resources/library/research-selection.json",
    "resources/library/relative-scores/*/*.json",
    "resources/library/relative-scores/*/*.tsv",
    "resources/library/relative-scores/*/clusters/*/*.json",
    "resources/library/relative-scores/*/clusters/*/*.npy",
    "resources/library/research/*/*.json",
    "resources/library/research/*/*.tsv",
    "resources/library/research/*/*.gz",
    "resources/library/research/*/clusters/*/*.json",
    "resources/library/research/*/clusters/*/*.gz",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.exclude-package-data]
pclass_dark = ["resources/reference/*", "resources/reference/source_manifests/*"]
